name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts keeps this job hermetic and fast: the only install
      # script in the tree is the Confluent client's native binary fetch (or
      # a librdkafka compile on a Node ABI without a prebuilt binary). The
      # unit and contract suites never load the native module; the adapter
      # is exercised against a real broker in the integration job below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check:types

      # The published .d.ts is read by both compilers, so both must agree on
      # it. TypeScript 7 runs alongside rather than replacing 6: the tooling
      # that consumes the compiler API (typescript-eslint, the rollup
      # plugins) needs 6 until the 7.x programmatic API is stable.
      - name: Type check (TypeScript 7)
        run: npm run check:types:next

      - name: Unit and contract tests (with coverage)
        run: npm run test:coverage

      # Examples are documentation that must keep working: each one asserts
      # its own outcome, so a broken promise fails the build.
      - name: Examples
        run: npm run examples

      # Documentation compiles: every ts block in README and docs/ is
      # type-checked against src/, and every in-page anchor resolves.
      - name: Documentation snippets
        run: npm run check:docs

      - name: Build
        run: npm run build

      # The declaration bundles are checked the way a consumer sees them:
      # the unit suite loads src/, so only a compile against dist/ catches a
      # class inlined twice across entry points (nominal types, TS2345).
      - name: Consumer type check (built declarations)
        run: npx tsc -p tests/consumer/tsconfig.json

      # The public API is frozen: the build fails when exports drift from
      # the committed API report (etc/kafka-harbor.api.md).
      - name: API report check
        run: npx api-extractor run

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 22 has a prebuilt Confluent binary; the compile-from-source
          # path is not what this job is here to prove.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gated on the variable, exactly as in the sibling libraries: the suite
      # stays hermetic for anyone running it without Docker around. Under CI
      # the gate inverts: a Kafka container that fails to come up fails the
      # build instead of passing quietly with no coverage.
      - name: Integration tests (real Kafka via Testcontainers)
        run: npm run test:integration
        env:
          KAFKA_REQUIRED: '1'
